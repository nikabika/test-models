<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор Персонажа</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      z-index: 10;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #a3a3a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #666666;
      font-size: 1rem;
    }

    /* Контейнер для 3D сцены по центру */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 1.2rem;
      z-index: 2;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
    }

    .selection-zone {
      width: 100%;
      max-width: 1200px;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 24px;
      overflow-x: auto;
      padding: 20px 10px;
      scrollbar-width: none;
    }

    .selection-zone::-webkit-scrollbar {
      display: none;
    }

    .character-card {
      min-width: 200px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .character-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-8px);
    }

    .character-card.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    .character-card h3 {
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: -0.02em;
    }

    .action-btn {
      z-index: 10;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 16px 48px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
    }

    .action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 30px rgba(255, 255, 255, 0.25);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <header>
    <h1>ВЫБЕРИ СВОЕГО ГЕРОЯ</h1>
    <p>Модели автоматически центрируются на сцене</p>
  </header>

  <div id="loader">Загрузка модели...</div>
  <div id="canvas-container"></div>

  <div class="selection-zone" id="cards-container">
    
    <div class="character-card active" data-model="homelander.glb">
      <h3>Homelander</h3>
    </div>
    
    <div class="character-card" data-model="darthvader.glb">
      <h3>Darth Vader</h3>
    </div>

  </div>

  <button class="action-btn" id="start-btn">ПОДТВЕРДИТЬ</button>

  <script>
    const modelsFolder = './models/';
    let scene, camera, renderer, currentModel;
    const container = document.getElementById('canvas-container');
    const loaderElement = document.getElementById('loader');

    // 1. Инициализация сцены
    function init3D() {
      scene = new THREE.Scene();
      
      // Камера направлена четко в центр (0, 1.2, 0)
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 1.4, 3.0); 

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // Студийный свет со всех сторон, чтобы не было черных пятен
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7);
      scene.add(directionalLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
      fillLight.position.set(-5, 2, -2);
      scene.add(fillLight);

      animate();
    }

    // 2. Функция загрузки и жесткого центрирования модели
    function load3DModel(fileName) {
      loaderElement.style.display = 'block';
      loaderElement.innerText = 'Загрузка 3D модели...';

      if (currentModel) scene.remove(currentModel);

      const loader = new THREE.GLTFLoader();
      
      loader.load(
        modelsFolder + fileName,
        (gltf) => {
          currentModel = gltf.scene;

          // Расчет математических границ модели для идеального выравнивания
          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          
          // Сбрасываем локальные координаты модели строго в центр сцены (0, 0, 0)
          currentModel.position.x = -center.x;
          currentModel.position.z = -center.z;
          
          // Ставим ноги персонажа ровно на "пол" сцены (чуть ниже центра видимости камеры)
          currentModel.position.y = -box.min.y - 0.9;

          scene.add(currentModel);
          loaderElement.style.display = 'none';
        },
        (xhr) => {
          if (xhr.total > 0) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loaderElement.innerText = `Загрузка: ${percent}%`;
          }
        },
        (error) => {
          console.error(error);
          loaderElement.innerText = 'Ошибка чтения файла модели 💀';
        }
      );
    }

    // 3. Обработка кликов по интерфейсу
    function setupUI() {
      const cards = document.querySelectorAll('.character-card');
      
      cards.forEach(card => {
        card.addEventListener('click', () => {
          cards.forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          
          const modelFile = card.getAttribute('data-model');
          load3DModel(modelFile);
        });
      });

      // Грузим дефолтного персонажа (первого активного)
      const defaultActive = document.querySelector('.character-card.active');
      if (defaultActive) {
        load3DModel(defaultActive.getAttribute('data-model'));
      }
    }

    // 4. Цикл рендеринга и вращения
    function animate() {
      requestAnimationFrame(animate);
      
      // Вращаем модель строго вокруг её выровненного центра
      if (currentModel) {
        currentModel.rotation.y += 0.005;
      }
      
      renderer.render(scene, camera);
    }

    // Сброс размеров при изменении окна
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Кнопка отправки в бой
    document.getElementById('start-btn').addEventListener('click', () => {
      const activeCard = document.querySelector('.character-card.active h3');
      if (activeCard) {
        alert(`Погнали играть за: ${activeCard.innerText}! 👿`);
      }
    });

    // Старт системы
    init3D();
    setupUI();
  </script>
</body>
</html>
